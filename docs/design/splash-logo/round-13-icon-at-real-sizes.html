</style></head><body>

  <div class="cell"><img src="icon-gen.png" width="120"><div class="lab"><b>120px</b><br>iPhone @2x</div></div>
  <div class="cell"><img src="icon-gen.png" width="80"><div class="lab"><b>80px</b><br>settings</div></div>
  <div class="cell"><img src="icon-gen.png" width="60"><div class="lab"><b>60px</b><br>@1x / spotlight</div></div>

</div>
</body></html>
