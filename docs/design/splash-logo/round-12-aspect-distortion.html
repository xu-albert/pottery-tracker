<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #EDE5DA; font-family: -apple-system, Helvetica, Arial, sans-serif;
         color: #313131; padding: 30px 26px 24px; }
  h2 { font-size: 12.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
       opacity: .5; margin-bottom: 14px; }
  .row { display: flex; align-items: flex-end; }
  .cell { flex: 1; text-align: center; }
  .label { font-size: 14px; font-weight: 700; margin-top: 10px; }
  .sub { font-size: 12px; opacity: .6; margin-top: 3px; }
  .band { padding-bottom: 18px; margin-bottom: 20px; border-bottom: 1px solid rgba(49,49,49,.18); }
  .band:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .over { position: relative; height: 260px; }
  .over svg { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); }
</style>
</head>
<body>
<div id="out"></div>
<script>
const RIM  = "M 64 9.8 C 64.3 11.8, 58 13.6, 50 13.7 C 42 13.6, 35.8 12, 36 9.9 C 36.2 7.8, 42.5 6.2, 50.5 6.3 C 58.3 6.4, 63.8 8, 64 9.8 Z";
const BODY = "M 36 10.4 C 40 13.5, 44 17, 44.5 23 C 44.2 33, 43 42, 42.5 51 C 41.5 59, 36 64, 32 70 C 25.5 78, 20.5 85, 21 91 C 21.5 96, 26 99, 33 100 C 33.5 102, 33 104, 33 105.5 C 38 107.5, 62 107.5, 67 105.5 C 67 104, 66.5 102, 67 100 C 74 99, 78.5 96, 79 91 C 79.5 85, 74.5 78, 68 70 C 64 64, 58.5 59, 57.5 51 C 57 42, 55.8 33, 55.5 23 C 56 17, 60 13.5, 64 10.4";
const FOOT = "M 33 100 C 40 101.5, 60 101.5, 67 100";

// Scale only the x coordinates, exactly as Flutter's independent sx/sy does.
// Stroke width stays uniform, which is also what Flutter does.
function scaleX(d, k) {
  let n = -1;
  return d.replace(/-?\d+(\.\d+)?/g, (m) => { n++; return n % 2 === 0 ? (parseFloat(m) * k).toFixed(3) : m; });
}

function vase(h, k, sw) {
  const w = h * (100 * k) / 120;
  const vb = `0 0 ${100 * k} 120`;
  return `<svg width="${w.toFixed(1)}" height="${h}" viewBox="${vb}">
    <g fill="none" stroke="#313131" stroke-linecap="round" stroke-linejoin="round">
      <path stroke-width="${sw}" d="${scaleX(RIM, k)}"/>
      <path stroke-width="${sw}" d="${scaleX(BODY, k)}"/>
      <path stroke-width="${(sw * 0.75).toFixed(2)}" d="${scaleX(FOOT, k)}"/>
    </g></svg>`;
}

let h = "";

h += `<div class="band"><h2>Splash size &mdash; same height, true widths</h2><div class="row">`;
h += `<div class="cell"><div class="over">${vase(240, 1.0, 3.6)}</div>
      <div class="label">Approved</div><div class="sub">aspect 0.582</div></div>`;
h += `<div class="cell"><div class="over">${vase(240, 1.2, 3.6)}</div>
      <div class="label">What Flutter renders now</div><div class="sub">aspect 0.699 &mdash; 20% wider</div></div>`;
h += `<div class="cell"><div class="over">
        <svg width="240" height="240" viewBox="0 0 120 120">
          <g fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path stroke="#313131" stroke-opacity=".95" stroke-width="3.6" d="${scaleX(RIM,1.2)}"/>
            <path stroke="#313131" stroke-opacity=".95" stroke-width="3.6" d="${scaleX(BODY,1.2)}"/>
            <path stroke="#313131" stroke-opacity=".95" stroke-width="2.7" d="${scaleX(FOOT,1.2)}"/>
            <g transform="translate(10,0)">
              <path stroke="#BF7B5E" stroke-width="3.6" d="${RIM}"/>
              <path stroke="#BF7B5E" stroke-width="3.6" d="${BODY}"/>
              <path stroke="#BF7B5E" stroke-width="2.7" d="${FOOT}"/>
            </g>
          </g></svg></div>
      <div class="label">Overlaid</div><div class="sub">terracotta = approved, centred</div></div>`;
h += `</div></div>`;

h += `<div class="band"><h2>Icon size (60pt) &mdash; the app icon inherits the same stretch</h2><div class="row">`;
h += `<div class="cell"><div class="over" style="height:90px">${vase(72, 1.0, 5.6)}</div>
      <div class="label">Approved</div></div>`;
h += `<div class="cell"><div class="over" style="height:90px">${vase(72, 1.2, 5.6)}</div>
      <div class="label">Current</div></div>`;
h += `<div class="cell"><div class="over" style="height:90px"></div><div class="label"></div></div>`;
h += `</div></div>`;

document.getElementById("out").innerHTML = h;
</script>
</body>
</html>
