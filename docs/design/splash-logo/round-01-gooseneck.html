<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #EDE5DA;
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    color: #3C3C3C;
    padding: 36px 28px 28px;
  }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: .06em;
       text-transform: uppercase; opacity: .55; margin-bottom: 26px; }
  .row { display: flex; gap: 0; }
  .cell { flex: 1; text-align: center; }
  .label { font-size: 19px; font-weight: 700; margin-top: 14px; }
  .sub { font-size: 13px; opacity: .6; margin-top: 3px; }
  .small-row { margin-top: 40px; padding-top: 28px;
               border-top: 1px solid rgba(60,60,60,.18); }
  .caption { font-size: 12px; letter-spacing: .05em; text-transform: uppercase;
             opacity: .45; margin-bottom: 20px; text-align: center; }
</style>
</head>
<body>

<h1>Gooseneck silhouettes &mdash; splash size (240px)</h1>

<div class="row">
  <div class="cell">
    <svg width="240" height="288" viewBox="0 0 100 120">

    <div class="sub">classic gooseneck</div>
  </div>
  <div class="cell">

    <div class="sub">tall &amp; narrow</div>

  <div class="cell">

    <div class="sub">full-bellied</div>
  </div>
  <div class="cell">
    <svg width="240" height="288" viewBox="0 0 100 120">
      <path d="M 37 12 C 40 19, 42 29, 41 45 C 39 56, 26 60, 22 76 C 18 90, 26 103, 40 107 C 45 109, 56 108, 61 106 C 74 101, 80 88, 75 74 C 70 59, 60 56, 59 44 C 58 29, 60 20, 63 10"

    <div class="label">D</div>
    <div class="sub">asymmetric, leaning</div>
  </div>
</div>

<div class="small-row">
  <div class="caption">same marks at home-screen icon size (60pt)</div>

      <svg width="60" height="72" viewBox="0 0 100 120">

              stroke-linecap="round" stroke-linejoin="round"/>

              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>
</div>

</body>
</html>
